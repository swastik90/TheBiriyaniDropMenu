
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111110">
  <title>The Biryani Drop | Signature</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111110;
      --cream: #eee3c9;
      --gold: #b88748;
      --muted: #bdb19a;
      --line: rgba(184, 135, 72, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          ellipse at 50% 38%,
          #29251d 0%,
          #171715 44%,
          #10100f 100%
        );
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.075;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .landing {
      width: min(560px, 100%);
      text-align: center;
      padding: 48px 20px;
      animation: appear 1s ease both;
    }

    .top-ornament {
      width: 76px;
      height: 1px;
      margin: 0 auto 35px;
      background: linear-gradient(
        90deg, transparent, var(--gold), transparent
      );
      position: relative;
    }

    .top-ornament::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 50%;
      top: 50%;
      border: 1px solid var(--gold);
      background: #211e18;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 20px;
    }

    .the-script {
      color: var(--gold);
      font-family: 'Parisienne', cursive;
      font-size: clamp(48px, 10vw, 68px);
      line-height: 0.9;
      transform: rotate(-8deg);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(37px, 8vw, 57px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: 5px;
      text-align: left;
    }

    .tagline {
      margin-top: 30px;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      letter-spacing: 1.5px;
    }

    .divider {
      width: 140px;
      height: 1px;
      margin: 25px auto;
      background: linear-gradient(
        90deg, transparent, var(--line), transparent
      );
    }

    .license {
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .license strong {
      color: var(--gold);
      font-weight: 600;
    }

    .menu-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      min-width: 210px;
      margin-top: 43px;
      padding: 15px 27px;
      border: 1px solid var(--gold);
      color: var(--cream);
      background: rgba(184, 135, 72, 0.04);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .menu-link .arrow {
      color: var(--gold);
      font-size: 18px;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .menu-link:hover {
      color: #111110;
      background: var(--gold);
      box-shadow: 0 0 30px rgba(184, 135, 72, 0.12);
      transform: translateY(-2px);
    }

    .menu-link:hover .arrow {
      color: #111110;
      transform: translateX(4px);
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 5px;
    }

    .bottom-note {
      margin-top: 57px;
      color: rgba(189, 177, 154, 0.65);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .landing {
        padding: 30px 5px;
      }

      .brand-name {
        letter-spacing: 3px;
      }

      .tagline {
        font-size: 16px;
      }

      .menu-link {
        margin-top: 35px;
      }

      .bottom-note {
        margin-top: 45px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="landing">
    <div class="top-ornament" aria-hidden="true"></div>

    <div class="brand">
      <div class="the-script">The</div>
      <div class="brand-name">BIRYANI<br>DROP</div>
    </div>

    <p class="tagline">Where Every Grain Tells a Story</p>

    <div class="divider" aria-hidden="true"></div>

    <p class="license">
      FSSAI Licence No. <strong>22025056000411</strong>
    </p>

    <a class="menu-link" href="menu.html">
      <span>VIEW MENU</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="bottom-note">Authentic flavours · Timeless recipes</p>
  </main>
</body>
</html>
