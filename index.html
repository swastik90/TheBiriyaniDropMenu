
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111110">
  <meta name="description" content="Welcome to The Biryani Drop. Discover signature biryanis, authentic flavours, and delicious favourites.">
  <title>The Biryani Drop | Signature</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111110;
      --cream: #eee3c9;
      --gold: #b88748;
      --muted: #bdb19a;
      --line: rgba(184, 135, 72, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      isolation: isolate;

      background:
        radial-gradient(
          ellipse at 50% 38%,
          #29251d 0%,
          #171715 44%,
          #10100f 100%
        );

      color: var(--cream);
      font-family: 'Montserrat', Arial, sans-serif;
    }

    /* Subtle background grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.075;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");

      background-repeat: repeat;
      background-size: 180px 180px;
    }

    /* Main landing page */
    .landing {
      width: min(560px, 100%);
      padding: 38px 20px;
      text-align: center;
      animation: appear 1s ease both;
    }

    /* Decorative ornament */
    .top-ornament {
      width: 76px;
      height: 1px;
      margin: 0 auto 35px;
      position: relative;

      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }

    .top-ornament::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 50%;
      top: 50%;
      border: 1px solid var(--gold);
      background: #211e18;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    /* Brand lettering */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .the-script {
      color: var(--gold);
      font-family: 'Parisienne', cursive;
      font-size: clamp(48px, 10vw, 68px);
      line-height: 0.9;
      transform: rotate(-8deg);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(37px, 8vw, 57px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: 5px;
      text-align: left;
    }

    /* Welcome message */
    .welcome {
      margin-top: 30px;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(23px, 5vw, 30px);
      font-weight: 500;
      letter-spacing: 0.5px;
      line-height: 1.25;
    }

    /* Brand tagline */
    .tagline {
      margin-top: 10px;
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    /* Supporting welcome text */
    .welcome-note {
      max-width: 360px;
      margin: 15px auto 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: 0.5px;
    }

    /* Divider */
    .divider {
      width: 140px;
      height: 1px;
      margin: 25px auto;

      background: linear-gradient(
        90deg,
        transparent,
        var(--line),
        transparent
      );
    }

    /* FSSAI licence */
    .license {
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 0.5px;
      line-height: 1.7;
    }

    .license strong {
      color: var(--gold);
      font-weight: 600;
      white-space: nowrap;
    }

    /* View menu button */
    .menu-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17px;

      min-width: 210px;
      min-height: 52px;
      margin-top: 38px;
      padding: 15px 27px;

      border: 1px solid var(--gold);
      background: rgba(184, 135, 72, 0.04);
      color: var(--cream);

      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-decoration: none;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .menu-link .arrow {
      color: var(--gold);
      font-size: 18px;
      line-height: 1;
      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .menu-link:hover {
      color: #111110;
      background: var(--gold);
      box-shadow: 0 0 30px rgba(184, 135, 72, 0.12);
      transform: translateY(-2px);
    }

    .menu-link:hover .arrow {
      color: #111110;
      transform: translateX(4px);
    }

    .menu-link:focus-visible {
      outline: 2px solid var(--cream);
      outline-offset: 5px;
    }

    /* Bottom text */
    .bottom-note {
      margin-top: 48px;
      color: rgba(189, 177, 154, 0.65);
      font-size: 9px;
      letter-spacing: 2px;
      line-height: 1.8;
      text-transform: uppercase;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .landing {
        padding: 28px 5px;
      }

      .top-ornament {
        margin-bottom: 30px;
      }

      .brand {
        gap: 7px;
      }

      .brand-name {
        font-size: clamp(31px, 8vw, 40px);
        letter-spacing: 3px;
      }

      .the-script {
        font-size: clamp(42px, 11vw, 52px);
      }

      .welcome {
        margin-top: 28px;
        font-size: clamp(23px, 6vw, 28px);
      }

      .tagline {
        font-size: 16px;
      }

      .welcome-note {
        max-width: 310px;
        font-size: 10px;
      }

      .license {
        font-size: 14px;
      }

      .menu-link {
        margin-top: 32px;
      }

      .bottom-note {
        margin-top: 38px;
        font-size: 8px;
        letter-spacing: 1.5px;
      }
    }

    @media (max-height: 650px) {
      .landing {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .top-ornament {
        margin-bottom: 22px;
      }

      .welcome {
        margin-top: 20px;
      }

      .welcome-note {
        margin-top: 10px;
      }

      .divider {
        margin: 17px auto;
      }

      .menu-link {
        margin-top: 24px;
      }

      .bottom-note {
        margin-top: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="top-ornament" aria-hidden="true"></div>

    <div class="brand">
      <div class="the-script">The</div>
      <div class="brand-name">BIRYANI<br>DROP</div>
    </div>

    <p class="welcome">
      Welcome to The Biryani Drop
    </p>

    <p class="tagline">
      Where Every Grain Tells a Story
    </p>

    <p class="welcome-note">
      A warm welcome to a world of flavour,
      crafted with love and served with passion.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <p class="license">
      FSSAI Licence No.
      <strong>22025056000411</strong>
    </p>

    <a class="menu-link" href="menu.html">
      <span>VIEW MENU</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="bottom-note">
      Authentic Flavours &middot; Timeless Recipes
    </p>

  </main>

</body>
</html>
